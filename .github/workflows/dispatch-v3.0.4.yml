name: Dispatch v3.0.4 Release

on:
  pull_request:
    branches:
      - main
    paths:
      - release-trigger-v3.0.4.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.head_ref == 'release/trigger-v3.0.4'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the validated release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo Honguan/codex-model-router --ref main -f tag=v3.0.4 -f action=prepare-and-release
