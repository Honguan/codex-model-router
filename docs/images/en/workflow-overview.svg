<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-label="Codex Model Router – Main Workflow Overview"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#062b73"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2b5e" flood-opacity=".16"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#172b4d"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d41515"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0b7a2a"/></marker><style>text{font-family:Arial,sans-serif}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="45" y="70" font-size="46" font-weight="800" fill="#071633">Codex Model Router – Main Workflow Overview</text><text x="48" y="108" font-size="23" font-weight="700" fill="#4b5563">Avoid duplicate agents / do not call a child model when it matches the primary model</text><rect x="40" y="135" width="1320" height="90" rx="18" fill="#c91414" filter="url(#s)"/><text x="700" y="176" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="700">Principle: the same-model agent is not called repeatedly.</tspan><tspan x="700" dy="28">When the primary matches a child role, the main thread performs that role to avoid extra input tokens.</tspan></text><g font-size="22" font-weight="800" text-anchor="middle"><rect x="40" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#6a1bb1" stroke-width="2" filter="url(#s)"/><text x="197" y="300" fill="#6a1bb1">#1 Primary</text><rect x="370" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><text x="527" y="290" fill="#0b5bd3"><tspan x="527">#2 Luna Agent</tspan><tspan x="527" dy="26" font-size="16">reading + implementation</tspan></text><rect x="700" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#s)"/><text x="857" y="290" fill="#0b7a2a"><tspan x="857">#3 Terra Agent</tspan><tspan x="857" dy="26" font-size="16">planning / verification</tspan></text><rect x="1030" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#d41515" stroke-width="2" filter="url(#s)"/><text x="1187" y="290" fill="#d41515"><tspan x="1187">#4 Sol Agent</tspan><tspan x="1187" dy="26" font-size="16">escalation / plan rewrite</tspan></text></g><g font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><rect x="40" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#6a1bb1" stroke-width="2" filter="url(#s)"/><text x="150" y="435" font-size="20" font-weight="800" fill="#6a1bb1">1. #1 Primary</text><text x="150" y="500"><tspan x="150">Understand and confirm</tspan><tspan x="150" dy="24">the request; preserve</tspan><tspan x="150" dy="24">rules and conditions</tspan></text><rect x="300" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><text x="410" y="435" font-size="20" font-weight="800" fill="#0b5bd3">2. #2 Luna Agent</text><text x="410" y="500"><tspan x="410">Read required files, rules,</tspan><tspan x="410" dy="24">code, and dependencies;</tspan><tspan x="410" dy="24">assemble evidence</tspan></text><rect x="560" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#s)"/><text x="670" y="435" font-size="20" font-weight="800" fill="#0b7a2a">3. #3 Terra Agent</text><text x="670" y="500"><tspan x="670">Draft or update PLAN.md</tspan><tspan x="670" dy="24">from requirements</tspan><tspan x="670" dy="24">and evidence</tspan></text><rect x="820" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><text x="930" y="435" font-size="20" font-weight="800" fill="#0b5bd3">4. #2 Luna Agent</text><text x="930" y="500"><tspan x="930">Read PLAN.md, implement,</tspan><tspan x="930" dy="24">and produce an</tspan><tspan x="930" dy="24">implementation report</tspan></text><rect x="1080" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#s)"/><text x="1190" y="435" font-size="20" font-weight="800" fill="#0b7a2a">5. #3 Terra Agent</text><text x="1190" y="500"><tspan x="1190">Verify requirements, plan,</tspan><tspan x="1190" dy="24">completed output, and</tspan><tspan x="1190" dy="24">actual test results</tspan></text></g><g stroke="#172b4d" stroke-width="5" marker-end="url(#a)"><line x1="260" y1="540" x2="290" y2="540"/><line x1="520" y1="540" x2="550" y2="540"/><line x1="780" y1="540" x2="810" y2="540"/><line x1="1040" y1="540" x2="1070" y2="540"/></g><line x1="1300" y1="540" x2="1390" y2="540" stroke="#0b7a2a" stroke-width="5" marker-end="url(#g)"/><text x="1340" y="515" font-size="21" font-weight="800" fill="#0b7a2a">PASS</text><rect x="1395" y="390" width="170" height="300" rx="16" fill="#fff" stroke="#6a1bb1" stroke-width="2" filter="url(#s)"/><text x="1480" y="445" font-size="20" font-weight="800" fill="#6a1bb1" text-anchor="middle">9. #1 Primary</text><text x="1480" y="515" font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1480">Summarize verification</tspan><tspan x="1480" dy="24">and reply to the user</tspan></text><line x1="1190" y1="690" x2="1190" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><text x="1210" y="735" font-size="21" font-weight="800" fill="#d41515">FAIL</text><g font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><rect x="1080" y="780" width="220" height="260" rx="16" fill="#fff" stroke="#d41515" stroke-width="2" filter="url(#s)"/><text x="1190" y="830" font-size="20" font-weight="800" fill="#d41515">6. #4 Sol Agent</text><text x="1190" y="900"><tspan x="1190">Re-analyze and</tspan><tspan x="1190" dy="24">rewrite / revise PLAN.md</tspan></text><rect x="780" y="780" width="220" height="260" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><text x="890" y="830" font-size="20" font-weight="800" fill="#0b5bd3">7. #2 Luna Agent</text><text x="890" y="900"><tspan x="890">Read the revised PLAN.md</tspan><tspan x="890" dy="24">and implement again</tspan></text><rect x="480" y="780" width="220" height="260" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#s)"/><text x="590" y="830" font-size="20" font-weight="800" fill="#0b7a2a">8. #3 Terra Agent</text><text x="590" y="910">Re-verify the result</text></g><line x1="1080" y1="910" x2="1010" y2="910" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><line x1="780" y1="910" x2="710" y2="910" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><path d="M480 910H250V690" fill="none" stroke="#172b4d" stroke-width="5" marker-end="url(#a)"/><rect x="1390" y="135" width="370" height="220" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><rect x="1390" y="135" width="370" height="58" rx="20" fill="url(#h)"/><text x="1575" y="174" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">General Workflow Principles</text><text x="1420" y="225" font-size="16" font-weight="700" fill="#133a65"><tspan x="1420">✓ Do not call the same model repeatedly</tspan><tspan x="1420" dy="27">✓ Luna does not make core planning decisions</tspan><tspan x="1420" dy="27">✓ Terra owns planning and verification</tspan><tspan x="1420" dy="27">✓ Sol joins only on FAIL</tspan><tspan x="1420" dy="27">✓ The #1 primary returns the final reply</tspan></text><rect x="1390" y="735" width="370" height="330" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><rect x="1390" y="735" width="370" height="58" rx="20" fill="url(#h)"/><text x="1575" y="774" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">Flow Symbol Guide</text><text x="1420" y="825" font-size="17" font-weight="700" fill="#17366c"><tspan x="1420">PASS: verification passed</tspan><tspan x="1420" dy="38">FAIL: enter the repair flow</tspan><tspan x="1420" dy="38">Shield: verification</tspan><tspan x="1420" dy="38">Document: PLAN.md</tspan><tspan x="1420" dy="38">Code: implementation output</tspan><tspan x="1420" dy="38">Red arrow: repair direction</tspan></text><rect x="420" y="1080" width="800" height="80" rx="18" fill="#fff8f8" stroke="#d41515" stroke-width="2"/><text x="820" y="1130" font-size="24" font-weight="800" fill="#d41515" text-anchor="middle">6 → 7 → 8 is a repair loop; usually 1–2 rounds are recommended.</text></svg>