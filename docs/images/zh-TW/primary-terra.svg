<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="主模型情境圖 B – 主模型為 Terra"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#062b73"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18365f" flood-opacity=".15"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#172b4d"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d41515"/></marker><style>text{font-family:Arial,'Microsoft JhengHei','Noto Sans TC',sans-serif}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="800" y="62" font-size="40" font-weight="800" fill="#071633" text-anchor="middle">主模型情境圖 B – 主模型為 Terra（#1 = Terra）</text><text x="800" y="108" font-size="22" font-weight="700" fill="#304b7a" text-anchor="middle">#1 主模型直接承擔 Terra 企劃／驗證角色，不重複呼叫同模型子代理</text><rect x="280" y="135" width="980" height="72" rx="18" fill="#f4fff5" stroke="#0b7a2a" stroke-width="2" filter="url(#s)"/><text x="770" y="180" font-size="22" font-weight="800" fill="#086522" text-anchor="middle">因 #1 主模型已是 Terra，本情境不再額外呼叫 #3 Terra 代理。</text><g font-size="19" font-weight="800" text-anchor="middle"><rect x="55" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#6a1bb1" stroke-width="2"/><text x="152" y="270" fill="#6a1bb1">#1 Primary</text><rect x="270" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b5bd3" stroke-width="2"/><text x="367" y="270" fill="#0b5bd3">#2 Luna</text><rect x="485" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b7a2a" stroke-width="2"/><text x="582" y="270" fill="#0b7a2a">#3 Terra</text><rect x="700" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#d41515" stroke-width="2"/><text x="797" y="270" fill="#d41515">#4 Sol</text></g><g font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><rect x="35" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="140" y="385" font-size="21" font-weight="800" fill="#6a1bb1">1. #1（Terra）主模型</text><text x="140" y="455">理解需求並啟動流程</text><rect x="280" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#s)"/><text x="385" y="385" font-size="21" font-weight="800" fill="#0b5bd3">2. #2 Luna 代理</text><text x="385" y="445"><tspan x="385">讀取需求與依賴</tspan><tspan x="385" dy="25">整理證據包</tspan></text><rect x="525" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="630" y="385" font-size="21" font-weight="800" fill="#6a1bb1">3. #1（Terra）主模型</text><text x="630" y="455">撰寫／更新 PLAN.md</text><rect x="770" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#s)"/><text x="875" y="385" font-size="21" font-weight="800" fill="#0b5bd3">4. #2 Luna 代理</text><text x="875" y="455">閱讀 PLAN.md 並實作</text><rect x="1015" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="1120" y="385" font-size="20" font-weight="800" fill="#6a1bb1">5. #1（Terra）主模型</text><text x="1120" y="445"><tspan x="1120">驗證需求、企劃</tspan><tspan x="1120" dy="25">與完成成果</tspan></text></g><g stroke="#172b4d" stroke-width="5" marker-end="url(#a)"><line x1="245" y1="455" x2="268" y2="455"/><line x1="490" y1="455" x2="513" y2="455"/><line x1="735" y1="455" x2="758" y2="455"/><line x1="980" y1="455" x2="1003" y2="455"/></g><line x1="1225" y1="455" x2="1290" y2="455" stroke="#0b7a2a" stroke-width="5" marker-end="url(#a)"/><text x="1260" y="430" font-size="18" font-weight="800" fill="#0b7a2a">PASS</text><rect x="1300" y="350" width="180" height="210" rx="18" fill="#f7fff8" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="1390" y="420" font-size="18" font-weight="800" fill="#0b7a2a" text-anchor="middle"><tspan x="1390">回到 #1 主模型</tspan><tspan x="1390" dy="28">整理結果並回覆</tspan></text><line x1="1120" y1="580" x2="1120" y2="650" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><text x="1150" y="625" font-size="18" font-weight="800" fill="#d41515">FAIL</text><g font-size="17" font-weight="600" text-anchor="middle"><rect x="1015" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#d41515" stroke-width="3" filter="url(#s)"/><text x="1137" y="720" font-size="21" font-weight="800" fill="#d41515">6. #4 Sol 代理</text><text x="1137" y="780"><tspan x="1137">重新分析問題</tspan><tspan x="1137" dy="24">重寫／修訂 PLAN.md</tspan></text><rect x="720" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#s)"/><text x="842" y="720" font-size="21" font-weight="800" fill="#0b5bd3">7. #2 Luna 代理</text><text x="842" y="780">重讀修正版並重新實作</text><rect x="425" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="547" y="720" font-size="20" font-weight="800" fill="#6a1bb1">8. #1（Terra）主模型</text><text x="547" y="790">重新驗證結果</text></g><line x1="1015" y1="770" x2="977" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><line x1="720" y1="770" x2="682" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><rect x="1265" y="600" width="300" height="310" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><rect x="1265" y="600" width="300" height="55" rx="20" fill="url(#h)"/><text x="1415" y="637" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">重點說明</text><text x="1290" y="690" font-size="15" font-weight="700" fill="#17366c"><tspan x="1290">1. Terra 主模型負責企劃與驗證</tspan><tspan x="1290" dy="42">2. Luna 負責資料讀取與實作</tspan><tspan x="1290" dy="42">3. Sol 只在 FAIL 介入修訂</tspan><tspan x="1290" dy="42">4. 同模型不重複代理</tspan><tspan x="1290" dy="42">5. 最終由 #1 主模型回覆</tspan></text><rect x="55" y="910" width="1170" height="65" rx="16" fill="#fff9ec" stroke="#e99b00" stroke-width="2"/><text x="640" y="952" font-size="21" font-weight="800" fill="#7a4b00" text-anchor="middle">省去額外 Terra 子代理的上下文傳遞，有助於降低 input token。</text></svg>