name: Fix Windows path alias handling

on:
  push:
    branches:
      - fix/issues-18-26-v1.2.0
    paths:
      - ".github/workflows/fix-windows-path-alias.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issues-18-26-v1.2.0
          fetch-depth: 0

      - name: Apply physical-anchor path comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/router-core.js")
          text = path.read_text(encoding="utf-8")
          old = '''  const rel = relative(absoluteAnchor, absoluteTarget);
          const components = rel ? rel.split(sep) : [];
          let current = absoluteAnchor;
          const inspect = [current];
          for (const component of components) {
            current = join(current, component);
            inspect.push(current);
          }

          for (let index = 0; index < inspect.length; index += 1) {
            const candidate = inspect[index];
            let info;
            try {
              info = await lstat(candidate);
            } catch (error) {
              if (error?.code === "ENOENT") break;
              throw error;
            }
            if (info.isSymbolicLink()) {
              throw new Error(`unsafe path component for ${label}: ${candidate} is a symbolic link or junction`);
            }
            if (index < inspect.length - 1 && !info.isDirectory()) {
              throw new Error(`unsafe path component for ${label}: ${candidate} is not a directory`);
            }
            const physical = await realpath(candidate);
            if (normalizeForCompare(physical) !== normalizeForCompare(candidate)) {
              throw new Error(`unsafe path component for ${label}: ${candidate} resolves to ${physical}`);
            }
          }
          '''
          new = '''  const rel = relative(absoluteAnchor, absoluteTarget);
          const components = rel ? rel.split(sep) : [];
          const physicalAnchor = await realpath(absoluteAnchor);
          let current = absoluteAnchor;
          const inspect = [current];
          for (const component of components) {
            current = join(current, component);
            inspect.push(current);
          }

          for (let index = 0; index < inspect.length; index += 1) {
            const candidate = inspect[index];
            let info;
            try {
              info = await lstat(candidate);
            } catch (error) {
              if (error?.code === "ENOENT") break;
              throw error;
            }
            if (info.isSymbolicLink()) {
              throw new Error(`unsafe path component for ${label}: ${candidate} is a symbolic link or junction`);
            }
            if (index < inspect.length - 1 && !info.isDirectory()) {
              throw new Error(`unsafe path component for ${label}: ${candidate} is not a directory`);
            }
            const physical = await realpath(candidate);
            const expectedPhysical = resolve(physicalAnchor, relative(absoluteAnchor, candidate));
            if (normalizeForCompare(physical) !== normalizeForCompare(expectedPhysical)) {
              throw new Error(`unsafe path component for ${label}: ${candidate} resolves to ${physical}`);
            }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("expected path validation block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          npm run check
          npm test
          npm run test:package

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/router-core.js
          git commit -m "fix: accept equivalent Windows physical path aliases"
          git push origin HEAD:fix/issues-18-26-v1.2.0
