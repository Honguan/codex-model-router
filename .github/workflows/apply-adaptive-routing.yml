name: Apply adaptive routing refactor

on:
  push:
    branches:
      - feat/adaptive-free-routing
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/adaptive-free-routing
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare nested template literals
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/apply-adaptive-routing.mjs")
          text = path.read_text(encoding="utf-8")

          old_range = 'return `${source.slice(0, startIndex)}${replacement}${source.slice(endIndex)}`;'
          new_range = 'return `${source.slice(0, startIndex)}${replacement}${source.slice(endIndex + end.length)}`;'
          if old_range not in text:
              raise RuntimeError("replaceRange implementation was not found")
          text = text.replace(old_range, new_range, 1)

          helper = '''function replaceRangeAfter(source, anchor, start, end, replacement, label) {
            const anchorIndex = source.indexOf(anchor);
            if (anchorIndex < 0) throw new Error(`missing range anchor: ${label}`);
            const startIndex = source.indexOf(start, anchorIndex + anchor.length);
            if (startIndex < 0) throw new Error(`missing range start: ${label}`);
            const endIndex = source.indexOf(end, startIndex + start.length);
            if (endIndex < 0) throw new Error(`missing range end: ${label}`);
            return `${source.slice(0, startIndex)}${replacement}${source.slice(endIndex + end.length)}`;
          }

          '''
          marker = 'const manifest = `'
          if marker not in text:
              raise RuntimeError("manifest marker was not found")
          text = text.replace(marker, helper + marker, 1)

          doctor_config = 'core = replaceRange(core, "  const config = await readText(location.config);", "  for (const name of [\\"luna\\", \\"sol\\"])", `${doctorConfig}  for (const name of AGENT_NAMES)`, "doctor config and agents");'
          scoped_doctor_config = 'core = replaceRangeAfter(core, "async function doctor(scope) {", "  const config = await readText(location.config);", "  for (const name of [\\"luna\\", \\"sol\\"])", `${doctorConfig}  for (const name of AGENT_NAMES)`, "doctor config and agents");'
          if doctor_config not in text:
              raise RuntimeError("doctor config replacement was not found")
          text = text.replace(doctor_config, scoped_doctor_config, 1)

          doctor_skills = 'core = replaceRange(core, "  const skill = await readText(location.skill);", "  if (state.backup) {", `${doctorSkills}  if (state.backup) {`, "doctor skills");'
          scoped_doctor_skills = 'core = replaceRangeAfter(core, "async function doctor(scope) {", "  const skill = await readText(location.skill);", "  if (state.backup) {", `${doctorSkills}  if (state.backup) {`, "doctor skills");'
          if doctor_skills not in text:
              raise RuntimeError("doctor skills replacement was not found")
          text = text.replace(doctor_skills, scoped_doctor_skills, 1)

          def escape_between(start, end):
              global text
              left = text.index(start)
              right = text.index(end, left)
              block = text[left:right].replace("${", r"\${")
              text = text[:left] + block + text[right:]

          escape_between("const patchInstallConfig = `", "core = replaceRange(core, \"function patchInstallConfig")
          escape_between("core = replaceOnce(core,\n`  if (patched.changed)", '"free mode config behavior");')
          escape_between('core = replaceRange(core,\n"function validateSkill', '"skill validator");')
          escape_between("const appendedTests = `", "tests += appendedTests;")

          path.write_text(text, encoding="utf-8")

      - run: node --check scripts/apply-adaptive-routing.mjs
      - run: node scripts/apply-adaptive-routing.mjs
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: git diff --check

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adopt adaptive free model routing"
          git push origin HEAD:feat/adaptive-free-routing
