<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <style>
    text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#14213d}.title{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.t{font-size:16px}.s{font-size:14px}.box{fill:#fff;stroke-width:3;rx:16}.primary{stroke:#6f42c1}.luna{stroke:#1677ff}.terra{stroke:#1f9d55}.sol{stroke:#d9363e}.pass{fill:#daf5df;stroke:#238636}.fail{fill:#ffe0e0;stroke:#d9363e}.arrow{stroke:#263238;stroke-width:3;fill:none;marker-end:url(#a)}.retry{stroke:#d9363e;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#r)}.lane{fill:#f7f9fc;stroke:#9bb1d1;stroke-width:2;rx:18}.note{fill:#fff8db;stroke:#d49b00;stroke-width:2;rx:14}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9363e"/></marker></defs>
  <text x="800" y="50" text-anchor="middle" class="title">Codex Model Router — 完整資料處理流程</text>
  <text x="800" y="82" text-anchor="middle" class="t">同模型只使用同一代理編號；主模型與角色模型相同時直接由主執行緒執行，避免重複 input token</text>
  <rect x="30" y="105" width="1540" height="380" class="lane"/>
  <text x="55" y="140" class="h">標準流程</text>
  <rect x="55" y="170" width="190" height="120" class="box primary"/><text x="150" y="200" text-anchor="middle" class="h">#1 主模型</text><text x="150" y="228" text-anchor="middle" class="t">確認明確需求</text><text x="150" y="252" text-anchor="middle" class="s">問答、澄清、最終回覆</text>
  <rect x="285" y="170" width="220" height="120" class="box luna"/><text x="395" y="200" text-anchor="middle" class="h">#2 Luna</text><text x="395" y="228" text-anchor="middle" class="t">讀取所有必要需求</text><text x="395" y="252" text-anchor="middle" class="s">產生 REQUIREMENT_EVIDENCE</text>
  <rect x="545" y="170" width="220" height="120" class="box terra"/><text x="655" y="200" text-anchor="middle" class="h">#3 Terra</text><text x="655" y="228" text-anchor="middle" class="t">撰寫／更新 PLAN.md</text><text x="655" y="252" text-anchor="middle" class="s">High · read-only</text>
  <rect x="805" y="170" width="220" height="120" class="box luna"/><text x="915" y="200" text-anchor="middle" class="h">#2 Luna</text><text x="915" y="228" text-anchor="middle" class="t">閱讀完整企劃並實作</text><text x="915" y="252" text-anchor="middle" class="s">X-High · workspace-write</text>
  <rect x="1065" y="170" width="220" height="120" class="box terra"/><text x="1175" y="200" text-anchor="middle" class="h">#3 Terra</text><text x="1175" y="228" text-anchor="middle" class="t">驗證需求與成果</text><text x="1175" y="252" text-anchor="middle" class="s">PASS / non-PASS</text>
  <rect x="1325" y="170" width="190" height="120" class="box primary"/><text x="1420" y="200" text-anchor="middle" class="h">#1 主模型</text><text x="1420" y="228" text-anchor="middle" class="t">整理最終驗證結果</text><text x="1420" y="252" text-anchor="middle" class="s">回覆使用者</text>
  <path d="M245 230 H285 M505 230 H545 M765 230 H805 M1025 230 H1065 M1285 230 H1325" class="arrow"/>
  <rect x="1090" y="325" width="220" height="115" class="box sol"/><text x="1200" y="355" text-anchor="middle" class="h">#4 Sol</text><text x="1200" y="383" text-anchor="middle" class="t">失敗根因分析</text><text x="1200" y="407" text-anchor="middle" class="s">Medium · read-only · 修訂 PLAN.md</text>
  <rect x="805" y="325" width="220" height="115" class="box luna"/><text x="915" y="355" text-anchor="middle" class="h">#2 Luna</text><text x="915" y="383" text-anchor="middle" class="t">閱讀修訂企劃再實作</text><text x="915" y="407" text-anchor="middle" class="s">沿用同一 Luna 代理</text>
  <path d="M1175 290 V325" class="retry"/><path d="M1090 382 H1025" class="retry"/><path d="M915 325 V305 H1175 V290" class="retry"/>
  <text x="1300" y="315" class="t" fill="#238636">PASS → 主模型</text><text x="1190" y="315" class="t" fill="#d9363e">FAIL</text>

  <text x="35" y="535" class="h">主模型情境（相同模型不重複呼叫）</text>
  <rect x="30" y="560" width="500" height="210" class="lane"/><text x="55" y="595" class="h">主模型 = Sol</text><text x="55" y="628" class="t">#1 Sol 主模型 → #2 Luna → #3 Terra → #2 Luna → #3 Terra</text><text x="55" y="660" class="t">Terra non-PASS 時：由 #1 Sol 主模型直接執行升級審查</text><text x="55" y="692" class="t">不再建立 #4 Sol；最後由 #1 Sol 回覆</text>
  <rect x="550" y="560" width="500" height="210" class="lane"/><text x="575" y="595" class="h">主模型 = Terra</text><text x="575" y="628" class="t">#1 Terra 主模型 → #2 Luna → #1 Terra → #2 Luna → #1 Terra</text><text x="575" y="660" class="t">規劃與驗證均由 #1 Terra 主執行緒完成</text><text x="575" y="692" class="t">non-PASS 才呼叫 #3 Sol；最後由 #1 Terra 回覆</text>
  <rect x="1070" y="560" width="500" height="210" class="lane"/><text x="1095" y="595" class="h">主模型 = Luna</text><text x="1095" y="628" class="t">#1 Luna 主模型直接讀需求與實作 → #2 Terra 驗證</text><text x="1095" y="660" class="t">全程不再建立另一個 Luna 代理</text><text x="1095" y="692" class="t">non-PASS → #3 Sol → #1 Luna 修正 → #2 Terra</text>

  <rect x="30" y="800" width="1540" height="145" class="note"/>
  <text x="55" y="835" class="h">角色限制與思考等級</text>
  <text x="55" y="870" class="t">#1 Primary：依使用者選擇；負責問答、澄清、協調、最終回覆，不重複建立同模型角色。</text>
  <text x="55" y="900" class="t">Luna：X-High，唯一 workspace-write；先讀需求證據，再依完整 PLAN.md 實作，不做核心企劃決策、不自我核准。</text>
  <text x="820" y="870" class="t">Terra：High，read-only；根據證據寫企劃並獨立驗證，不直接修改程式。</text>
  <text x="820" y="900" class="t">Sol：Medium，read-only；只在 Terra non-PASS 後升級，分析根因並修訂企劃，不直接實作。</text>
</svg>