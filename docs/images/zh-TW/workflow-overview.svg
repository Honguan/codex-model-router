<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-label="Codex Model Router – 主流程總覽"><defs><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062b73"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2b5e" flood-opacity="0.16"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#172b4d"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d41515"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a2a"/></marker><style>text{font-family:Arial,'Microsoft JhengHei','Noto Sans TC',sans-serif}</style></defs><rect width="1800" height="1200" fill="#fff"/><text x="45" y="70" font-size="46" font-weight="800" fill="#071633">Codex Model Router – 主流程總覽</text><text x="48" y="108" font-size="23" font-weight="700" fill="#4b5563">避免重複代理／主模型與子模型相同時不重複呼叫</text><rect x="40" y="135" width="1320" height="90" rx="18" fill="#c91414" filter="url(#shadow)"/><text x="700" y="188" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">原則：同模型代理在同一流程中不重複呼叫；主模型與子模型角色相同時，由主線程直接執行該角色工作，避免增加 input token。</text><g font-size="22" font-weight="800"><rect x="40" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#6a1bb1" stroke-width="2" filter="url(#shadow)"/><text x="195" y="300" fill="#6a1bb1" text-anchor="middle">#1 主模型</text><rect x="370" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><text x="527" y="300" fill="#0b5bd3" text-anchor="middle">#2 Luna 代理</text><rect x="700" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#shadow)"/><text x="857" y="300" fill="#0b7a2a" text-anchor="middle">#3 Terra 代理</text><rect x="1030" y="245" width="315" height="95" rx="16" fill="#fff" stroke="#d41515" stroke-width="2" filter="url(#shadow)"/><text x="1187" y="300" fill="#d41515" text-anchor="middle">#4 Sol 代理</text></g><g font-size="17" font-weight="600" fill="#111827"><rect x="40" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#6a1bb1" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="420" r="20" fill="#6a1bb1"/><text x="70" y="428" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="150" y="430" font-size="20" font-weight="800" fill="#6a1bb1" text-anchor="middle">#1 主模型</text><text x="150" y="505" text-anchor="middle"><tspan x="150">理解並確認需求</tspan><tspan x="150" dy="25">保留原始需求與規則</tspan><tspan x="150" dy="25">指示 #2 讀取資料</tspan></text><rect x="300" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><circle cx="330" cy="420" r="20" fill="#0b5bd3"/><text x="330" y="428" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="410" y="430" font-size="20" font-weight="800" fill="#0b5bd3" text-anchor="middle">#2 Luna 代理</text><text x="410" y="505" text-anchor="middle"><tspan x="410">讀取必要檔案與規則</tspan><tspan x="410" dy="25">整理程式與依賴</tspan><tspan x="410" dy="25">建立需求證據包</tspan></text><rect x="560" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#shadow)"/><circle cx="590" cy="420" r="20" fill="#0b7a2a"/><text x="590" y="428" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="670" y="430" font-size="20" font-weight="800" fill="#0b7a2a" text-anchor="middle">#3 Terra 代理</text><text x="670" y="505" text-anchor="middle"><tspan x="670">根據需求與證據</tspan><tspan x="670" dy="25">撰寫／更新 PLAN.md</tspan></text><rect x="820" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><circle cx="850" cy="420" r="20" fill="#0b5bd3"/><text x="850" y="428" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="930" y="430" font-size="20" font-weight="800" fill="#0b5bd3" text-anchor="middle">#2 Luna 代理</text><text x="930" y="505" text-anchor="middle"><tspan x="930">閱讀 PLAN.md</tspan><tspan x="930" dy="25">依企劃實作</tspan><tspan x="930" dy="25">產出實作報告</tspan></text><rect x="1080" y="390" width="220" height="300" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#shadow)"/><circle cx="1110" cy="420" r="20" fill="#0b7a2a"/><text x="1110" y="428" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="1190" y="430" font-size="20" font-weight="800" fill="#0b7a2a" text-anchor="middle">#3 Terra 代理</text><text x="1190" y="505" text-anchor="middle"><tspan x="1190">驗證需求與企劃</tspan><tspan x="1190" dy="25">比對完成成果與測試</tspan></text></g><g stroke-width="5" fill="none"><line x1="260" y1="540" x2="290" y2="540" stroke="#172b4d" marker-end="url(#arrow)"/><line x1="520" y1="540" x2="550" y2="540" stroke="#172b4d" marker-end="url(#arrow)"/><line x1="780" y1="540" x2="810" y2="540" stroke="#172b4d" marker-end="url(#arrow)"/><line x1="1040" y1="540" x2="1070" y2="540" stroke="#172b4d" marker-end="url(#arrow)"/><line x1="1300" y1="540" x2="1390" y2="540" stroke="#0b7a2a" marker-end="url(#arrowGreen)"/></g><text x="1340" y="515" font-size="21" font-weight="800" fill="#0b7a2a">PASS</text><rect x="1395" y="390" width="170" height="300" rx="16" fill="#fff" stroke="#6a1bb1" stroke-width="2" filter="url(#shadow)"/><circle cx="1425" cy="420" r="20" fill="#6a1bb1"/><text x="1425" y="428" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">9</text><text x="1480" y="470" font-size="20" font-weight="800" fill="#6a1bb1" text-anchor="middle">#1 主模型</text><text x="1480" y="530" font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1480">整理驗證結果</tspan><tspan x="1480" dy="25">回覆使用者</tspan></text><line x1="1190" y1="690" x2="1190" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#arrowRed)"/><text x="1210" y="735" font-size="21" font-weight="800" fill="#d41515">FAIL</text><g font-size="17" font-weight="600" fill="#111827"><rect x="1080" y="780" width="220" height="260" rx="16" fill="#fff" stroke="#d41515" stroke-width="2" filter="url(#shadow)"/><circle cx="1110" cy="810" r="20" fill="#d41515"/><text x="1110" y="818" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="1190" y="820" font-size="20" font-weight="800" fill="#d41515" text-anchor="middle">#4 Sol 代理</text><text x="1190" y="900" text-anchor="middle"><tspan x="1190">重新分析問題</tspan><tspan x="1190" dy="25">重寫／修訂 PLAN.md</tspan></text><rect x="780" y="780" width="220" height="260" rx="16" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><circle cx="810" cy="810" r="20" fill="#0b5bd3"/><text x="810" y="818" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="890" y="820" font-size="20" font-weight="800" fill="#0b5bd3" text-anchor="middle">#2 Luna 代理</text><text x="890" y="900" text-anchor="middle"><tspan x="890">重讀修正版 PLAN.md</tspan><tspan x="890" dy="25">重新實作</tspan></text><rect x="480" y="780" width="220" height="260" rx="16" fill="#fff" stroke="#0b7a2a" stroke-width="2" filter="url(#shadow)"/><circle cx="510" cy="810" r="20" fill="#0b7a2a"/><text x="510" y="818" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="590" y="820" font-size="20" font-weight="800" fill="#0b7a2a" text-anchor="middle">#3 Terra 代理</text><text x="590" y="900" text-anchor="middle">重新驗證結果</text></g><line x1="1080" y1="910" x2="1010" y2="910" stroke="#d41515" stroke-width="5" marker-end="url(#arrowRed)"/><line x1="780" y1="910" x2="710" y2="910" stroke="#d41515" stroke-width="5" marker-end="url(#arrowRed)"/><path d="M480 910 H250 V690" fill="none" stroke="#172b4d" stroke-width="5" marker-end="url(#arrow)"/><rect x="1390" y="135" width="370" height="220" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><rect x="1390" y="135" width="370" height="58" rx="20" fill="url(#head)"/><text x="1575" y="174" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">通用流程原則</text><text x="1420" y="225" font-size="16" font-weight="700" fill="#133a65"><tspan x="1420">✓ 同模型不重複呼叫</tspan><tspan x="1420" dy="27">✓ Luna 不自行做核心企劃</tspan><tspan x="1420" dy="27">✓ Terra 負責企劃與驗證</tspan><tspan x="1420" dy="27">✓ Sol 只在 FAIL 介入</tspan><tspan x="1420" dy="27">✓ 最終由 #1 主模型回覆</tspan></text><rect x="1390" y="735" width="370" height="330" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><rect x="1390" y="735" width="370" height="58" rx="20" fill="url(#head)"/><text x="1575" y="774" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">流程符號說明</text><text x="1420" y="825" font-size="17" font-weight="700" fill="#17366c"><tspan x="1420">PASS：驗證通過</tspan><tspan x="1420" dy="38">FAIL：進入修正流程</tspan><tspan x="1420" dy="38">盾牌：驗證</tspan><tspan x="1420" dy="38">文件：PLAN.md</tspan><tspan x="1420" dy="38">程式碼：實作結果</tspan><tspan x="1420" dy="38">紅色箭頭：修正方向</tspan></text><rect x="420" y="1080" width="800" height="80" rx="18" fill="#fff8f8" stroke="#d41515" stroke-width="2"/><text x="820" y="1130" font-size="24" font-weight="800" fill="#d41515" text-anchor="middle">6 → 7 → 8 為修正循環，通常建議 1～2 次。</text></svg>