<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1400" viewBox="0 0 1100 1400" role="img" aria-label="主模型問答情境（流程外）">
<defs>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062b73"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2b5e" flood-opacity="0.16"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#172b4d"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d41515"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a2a"/></marker>
  <style>
    text { font-family: Arial, 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; }
    .title { font-size:44px; font-weight:800; fill:#081a3a; }
    .subtitle { font-size:24px; font-weight:700; fill:#304b7a; }
    .h2 { font-size:28px; font-weight:800; fill:#fff; }
    .label { font-size:22px; font-weight:800; }
    .body { font-size:18px; font-weight:600; fill:#111827; }
    .small { font-size:15px; font-weight:600; fill:#374151; }
  </style>
</defs>
<rect width="1100" height="1400" fill="#ffffff"/>
<rect x="25" y="20" width="1050" height="175" rx="32" fill="url(#head)"/><text x="550" y="88" font-size="50" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="550" dy="0">主模型問答情境（流程外）</tspan></text><rect x="25" y="180" width="1050" height="1190" rx="30" fill="#fff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><rect x="75" y="230" width="210" height="210" rx="28" fill="#f7fbff" stroke="#5c94e6" stroke-width="2" filter="url(#shadow)"/><rect x="110" y="290" width="140" height="95" rx="45" fill="#0b5bd3"/><circle cx="145" cy="338" r="9" fill="#fff"/><circle cx="180" cy="338" r="9" fill="#fff"/><circle cx="215" cy="338" r="9" fill="#fff"/><text x="335" y="295" font-size="26" font-weight="800" fill="#0b2f78" text-anchor="start"><tspan x="335" dy="0">一般問答／說明／翻譯／建議：</tspan></text><text x="335" y="345" font-size="24" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="335" dy="0">由 #1 主模型直接回答，</tspan><tspan x="335" dy="37.2">不啟動資料處理流程。</tspan></text><line x1="80" y1="485" x2="1020" y2="485" stroke="#c9d8ee" stroke-width="2"/><rect x="75" y="515" width="210" height="210" rx="28" fill="#f7fbff" stroke="#5c94e6" stroke-width="2" filter="url(#shadow)"/><circle cx="165" cy="610" r="55" fill="none" stroke="#0b5bd3" stroke-width="16"/><line x1="205" y1="650" x2="250" y2="695" stroke="#0b5bd3" stroke-width="18" stroke-linecap="round"/><text x="335" y="580" font-size="26" font-weight="800" fill="#0b2f78" text-anchor="start"><tspan x="335" dy="0">單一明確查詢或簡單分析：</tspan></text><text x="335" y="630" font-size="24" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="335" dy="0">由 #1 主模型直接處理，</tspan><tspan x="335" dy="37.2">通常不啟動代理。</tspan></text><line x1="80" y1="770" x2="1020" y2="770" stroke="#c9d8ee" stroke-width="2"/><rect x="75" y="800" width="210" height="210" rx="28" fill="#f7fbff" stroke="#5c94e6" stroke-width="2" filter="url(#shadow)"/><text x="180" y="942" font-size="110" font-weight="800" fill="#0b5bd3" text-anchor="middle"><tspan x="180" dy="0">?</tspan></text><text x="335" y="865" font-size="26" font-weight="800" fill="#0b2f78" text-anchor="start"><tspan x="335" dy="0">需求不明確／缺少條件：</tspan></text><text x="335" y="915" font-size="24" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="335" dy="0">由 #1 主模型先詢問使用者，</tspan><tspan x="335" dy="37.2">不進入標準流程。</tspan></text><line x1="80" y1="1055" x2="1020" y2="1055" stroke="#c9d8ee" stroke-width="2"/><rect x="75" y="1085" width="210" height="210" rx="28" fill="#f7fbff" stroke="#5c94e6" stroke-width="2" filter="url(#shadow)"/><circle cx="120" cy="1155" r="10" fill="#0b5bd3"/><line x1="150" y1="1155" x2="240" y2="1155" stroke="#0b5bd3" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="1200" r="10" fill="#0b5bd3"/><line x1="150" y1="1200" x2="240" y2="1200" stroke="#0b5bd3" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="1245" r="10" fill="#0b5bd3"/><line x1="150" y1="1245" x2="240" y2="1245" stroke="#0b5bd3" stroke-width="12" stroke-linecap="round"/><text x="335" y="1150" font-size="26" font-weight="800" fill="#0b2f78" text-anchor="start"><tspan x="335" dy="0">只有在需要需求探索、</tspan></text><text x="335" y="1200" font-size="24" font-weight="600" fill="#1f2937" text-anchor="start"><tspan x="335" dy="0">寫企劃、製作、驗證時，</tspan><tspan x="335" dy="37.2">才進入完整資料處理流程。</tspan></text></svg>