<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Primary Model Scenario C – Primary is Luna"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#062b73"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18365f" flood-opacity=".15"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#172b4d"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d41515"/></marker><style>text{font-family:Arial,sans-serif}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="800" y="62" font-size="39" font-weight="800" fill="#071633" text-anchor="middle">Primary Model Scenario C – Primary is Luna (#1 = Luna)</text><text x="800" y="108" font-size="22" font-weight="700" fill="#304b7a" text-anchor="middle">The #1 primary directly performs the Luna reading / implementation role; no duplicate Luna child agent is called.</text><rect x="250" y="135" width="1050" height="72" rx="18" fill="#f5f9ff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><text x="775" y="180" font-size="22" font-weight="800" fill="#0b3d83" text-anchor="middle">Because #1 is already Luna, this scenario does not additionally call the #2 Luna agent.</text><g font-size="19" font-weight="800" text-anchor="middle"><rect x="55" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#6a1bb1" stroke-width="2"/><text x="152" y="270" fill="#6a1bb1">#1 Primary</text><rect x="270" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b5bd3" stroke-width="2"/><text x="367" y="270" fill="#0b5bd3">#2 Luna</text><rect x="485" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b7a2a" stroke-width="2"/><text x="582" y="270" fill="#0b7a2a">#3 Terra</text><rect x="700" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#d41515" stroke-width="2"/><text x="797" y="270" fill="#d41515">#4 Sol</text></g><g font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><rect x="60" y="330" width="240" height="250" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="180" y="385" font-size="19" font-weight="800" fill="#6a1bb1">1. #1 (Luna) Primary</text><text x="180" y="445"><tspan x="180">Read requirements, rules,</tspan><tspan x="180" dy="25">dependencies; collect evidence</tspan></text><rect x="350" y="330" width="240" height="250" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="470" y="385" font-size="21" font-weight="800" fill="#0b7a2a">2. #3 Terra Agent</text><text x="470" y="455">Draft / update PLAN.md</text><rect x="640" y="330" width="240" height="250" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="760" y="385" font-size="19" font-weight="800" fill="#6a1bb1">3. #1 (Luna) Primary</text><text x="760" y="455">Read PLAN.md and implement</text><rect x="930" y="330" width="240" height="250" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="1050" y="385" font-size="21" font-weight="800" fill="#0b7a2a">4. #3 Terra Agent</text><text x="1050" y="455">Verify the completed result</text></g><g stroke="#172b4d" stroke-width="5" marker-end="url(#a)"><line x1="300" y1="455" x2="338" y2="455"/><line x1="590" y1="455" x2="628" y2="455"/><line x1="880" y1="455" x2="918" y2="455"/></g><line x1="1170" y1="455" x2="1260" y2="455" stroke="#0b7a2a" stroke-width="5" marker-end="url(#a)"/><text x="1210" y="430" font-size="18" font-weight="800" fill="#0b7a2a">PASS</text><rect x="1270" y="350" width="200" height="210" rx="18" fill="#f7fff8" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="1370" y="415" font-size="18" font-weight="800" fill="#0b7a2a" text-anchor="middle"><tspan x="1370">#1 Primary</tspan><tspan x="1370" dy="28">summarizes and</tspan><tspan x="1370" dy="28">replies to the user</tspan></text><line x1="1050" y1="580" x2="1050" y2="650" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><text x="1080" y="625" font-size="18" font-weight="800" fill="#d41515">FAIL</text><g font-size="17" font-weight="600" text-anchor="middle"><rect x="930" y="665" width="240" height="210" rx="18" fill="#fff" stroke="#d41515" stroke-width="3" filter="url(#s)"/><text x="1050" y="720" font-size="21" font-weight="800" fill="#d41515">5. #4 Sol Agent</text><text x="1050" y="780"><tspan x="1050">Re-analyze and</tspan><tspan x="1050" dy="24">rewrite / revise PLAN.md</tspan></text><rect x="640" y="665" width="240" height="210" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="760" y="720" font-size="19" font-weight="800" fill="#6a1bb1">6. #1 (Luna) Primary</text><text x="760" y="780"><tspan x="760">Re-read the revision</tspan><tspan x="760" dy="24">and implement again</tspan></text><rect x="350" y="665" width="240" height="210" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="470" y="720" font-size="21" font-weight="800" fill="#0b7a2a">7. #3 Terra Agent</text><text x="470" y="790">Re-verify the result</text></g><line x1="930" y1="770" x2="892" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><line x1="640" y1="770" x2="602" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><rect x="1200" y="600" width="360" height="310" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><rect x="1200" y="600" width="360" height="55" rx="20" fill="url(#h)"/><text x="1380" y="637" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Key Points</text><text x="1230" y="690" font-size="15" font-weight="700" fill="#17366c"><tspan x="1230">1. Luna primary handles reading and implementation</tspan><tspan x="1230" dy="42">2. Terra handles planning and verification</tspan><tspan x="1230" dy="42">3. Sol joins only on FAIL to revise the plan</tspan><tspan x="1230" dy="42">4. The same model is not duplicated</tspan><tspan x="1230" dy="42">5. The #1 primary returns the final reply</tspan></text><rect x="55" y="910" width="1100" height="65" rx="16" fill="#fff9ec" stroke="#e99b00" stroke-width="2"/><text x="605" y="952" font-size="21" font-weight="800" fill="#7a4b00" text-anchor="middle">Removes the extra Luna-agent context handoff, helping reduce input tokens.</text></svg>