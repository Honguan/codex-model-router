name: Apply configurable agent reasoning change

on:
  push:
    branches:
      - feat/configurable-agent-reasoning

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/configurable-agent-reasoning
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Normalize generated-file literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("scripts/apply-agent-reasoning-change.mjs")
          text = path.read_text(encoding="utf-8")

          def convert_raw(source, target_path, next_marker):
              start_marker = f'await write("{target_path}", String.raw`'
              start = source.index(start_marker)
              content_start = start + len(start_marker)
              next_start = source.index(next_marker, content_start)
              close = source.rfind("\n`);", content_start, next_start)
              if close < 0:
                  raise RuntimeError(f"closing marker not found for {target_path}")
              content = source[content_start:close]
              replacement = f"await write({json.dumps(target_path)}, {json.dumps(content)});"
              return source[:start] + replacement + source[close + len("\n`);"):]

          text = convert_raw(
              text,
              "lib/agent-reasoning-cli.js",
              '\n\nawait write("bin/codex-model-router.js"'
          )
          text = convert_raw(
              text,
              "bin/codex-model-router.js",
              '\n\nawait write("test/agent-reasoning.test.js"'
          )
          text = convert_raw(
              text,
              "test/agent-reasoning.test.js",
              "\n\nlet packageJson ="
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply repository changes
        run: node scripts/apply-agent-reasoning-change.mjs

      - name: Validate
        run: |
          npm run check
          npm test
          npm run test:package

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: configure managed agent reasoning"
          git push origin HEAD:feat/configurable-agent-reasoning
