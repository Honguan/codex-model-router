name: Release v1.1.0 trigger

on:
  issues:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.issue.title == 'Release v1.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - name: Create v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.1.0 \
            --target 843fb2ae38533309f125065766c24a9afe1b8216 \
            --title v1.1.0 \
            --notes-file CHANGELOG.md
