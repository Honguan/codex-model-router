<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="主模型情境圖 A – 主模型為 Sol（#1 = Sol）"><defs><linearGradient id="hd" x1="0" x2="1"><stop stop-color="#062b73"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18365f" flood-opacity=".15"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#172b4d"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d41515"/></marker><style>text{font-family:Arial,'Microsoft JhengHei','Noto Sans TC',sans-serif}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="800" y="62" font-size="40" font-weight="800" fill="#071633" text-anchor="middle">主模型情境圖 A – 主模型為 Sol（#1 = Sol）</text><text x="800" y="108" font-size="22" font-weight="700" fill="#304b7a" text-anchor="middle">#1 主模型直接承擔 Sol 升級審查角色，不重複呼叫同模型子代理</text><rect x="280" y="135" width="980" height="72" rx="18" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#sh)"/><text x="770" y="180" font-size="22" font-weight="800" fill="#0b3d83" text-anchor="middle">因 #1 主模型已是 Sol，本情境不再額外呼叫 #4 Sol 代理。</text><g font-size="19" font-weight="800" text-anchor="middle"><rect x="55" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#6a1bb1" stroke-width="2"/><text x="152" y="270" fill="#6a1bb1">#1</text><rect x="270" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b5bd3" stroke-width="2"/><text x="367" y="270" fill="#0b5bd3">#2 Luna</text><rect x="485" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b7a2a" stroke-width="2"/><text x="582" y="270" fill="#0b7a2a">#3 Terra</text><rect x="700" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#d41515" stroke-width="2"/><text x="797" y="270" fill="#d41515">#4 Sol</text></g><g font-family="Arial,'Microsoft JhengHei','Noto Sans TC',sans-serif"><rect x="35" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#sh)"/><circle cx="67" cy="362" r="22" fill="#6a1bb1"/><text x="67" y="370" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140" y="380" font-size="21" font-weight="800" fill="#6a1bb1" text-anchor="middle">#1（Sol）主模型</text><text x="140" y="455" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">理解需求並決定啟動流程</text><rect x="280" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#sh)"/><circle cx="312" cy="362" r="22" fill="#0b5bd3"/><text x="312" y="370" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="385" y="380" font-size="21" font-weight="800" fill="#0b5bd3" text-anchor="middle">#2 Luna 代理</text><text x="385" y="445" font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="385">讀取需求、規則與依賴</tspan><tspan x="385" dy="24">整理證據包</tspan></text><rect x="525" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#sh)"/><circle cx="557" cy="362" r="22" fill="#0b7a2a"/><text x="557" y="370" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="630" y="380" font-size="21" font-weight="800" fill="#0b7a2a" text-anchor="middle">#3 Terra 代理</text><text x="630" y="455" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">撰寫／更新 PLAN.md</text><rect x="770" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#sh)"/><circle cx="802" cy="362" r="22" fill="#0b5bd3"/><text x="802" y="370" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="875" y="380" font-size="21" font-weight="800" fill="#0b5bd3" text-anchor="middle">#2 Luna 代理</text><text x="875" y="455" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">閱讀 PLAN.md 並實作</text><rect x="1015" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#sh)"/><circle cx="1047" cy="362" r="22" fill="#0b7a2a"/><text x="1047" y="370" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="1120" y="380" font-size="21" font-weight="800" fill="#0b7a2a" text-anchor="middle">#3 Terra 代理</text><text x="1120" y="455" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">驗證結果</text></g><g stroke-width="5" fill="none"><line x1="245" y1="455" x2="268" y2="455" stroke="#172b4d" marker-end="url(#a)"/><line x1="490" y1="455" x2="513" y2="455" stroke="#172b4d" marker-end="url(#a)"/><line x1="735" y1="455" x2="758" y2="455" stroke="#172b4d" marker-end="url(#a)"/><line x1="980" y1="455" x2="1003" y2="455" stroke="#172b4d" marker-end="url(#a)"/><line x1="1225" y1="455" x2="1290" y2="455" stroke="#0b7a2a" marker-end="url(#a)"/></g><text x="1260" y="430" font-size="18" font-weight="800" fill="#0b7a2a" text-anchor="middle">PASS</text><rect x="1300" y="350" width="180" height="210" rx="18" fill="#f7fff8" stroke="#0b7a2a" stroke-width="3" filter="url(#sh)"/><text x="1390" y="430" font-size="18" font-weight="800" fill="#0b7a2a" text-anchor="middle"><tspan x="1390">整理結果</tspan><tspan x="1390" dy="28">回覆使用者</tspan></text><line x1="1120" y1="580" x2="1120" y2="650" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><text x="1150" y="625" font-size="18" font-weight="800" fill="#d41515" text-anchor="middle">FAIL</text><rect x="1015" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#d41515" stroke-width="3" filter="url(#sh)"/><circle cx="1047" cy="697" r="22" fill="#d41515"/><text x="1047" y="705" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="1137" y="715" font-size="21" font-weight="800" fill="#d41515" text-anchor="middle">#1（Sol）主模型</text><text x="1137" y="780" font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1137">FAIL：重新分析並</tspan><tspan x="1137" dy="24">重寫／修訂 PLAN.md</tspan></text><rect x="720" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#sh)"/><circle cx="752" cy="697" r="22" fill="#0b5bd3"/><text x="752" y="705" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="842" y="715" font-size="21" font-weight="800" fill="#0b5bd3" text-anchor="middle">#2 Luna 代理</text><text x="842" y="780" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">重讀修正版並重新實作</text><rect x="425" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#sh)"/><circle cx="457" cy="697" r="22" fill="#0b7a2a"/><text x="457" y="705" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="547" y="715" font-size="21" font-weight="800" fill="#0b7a2a" text-anchor="middle">#3 Terra 代理</text><text x="547" y="780" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">重新驗證結果</text><line x1="1015" y1="770" x2="977" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><line x1="720" y1="770" x2="682" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><rect x="1265" y="600" width="300" height="310" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#sh)"/><rect x="1265" y="600" width="300" height="55" rx="20" fill="url(#hd)"/><text x="1415" y="637" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">重點說明</text><text x="1290" y="690" font-size="15" font-weight="700" fill="#17366c"><tspan x="1290">1. 同模型代理不重複呼叫</tspan><tspan x="1290" dy="42">2. Sol 僅在 FAIL／企劃重寫時審查</tspan><tspan x="1290" dy="42">3. Luna 負責讀取與實作</tspan><tspan x="1290" dy="42">4. Terra 負責企劃與驗證</tspan><tspan x="1290" dy="42">5. 最終由 #1 主模型回覆</tspan></text><rect x="55" y="910" width="1170" height="65" rx="16" fill="#fff9ec" stroke="#e99b00" stroke-width="2"/><text x="640" y="952" font-size="21" font-weight="800" fill="#7a4b00" text-anchor="middle">成功：#1→#2→#3→#2→#3→回覆　失敗修正：再經 #1→#2→#3</text></svg>