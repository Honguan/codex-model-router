name: Assemble release sources

on:
  push:
    branches: [release/1.0.0-complete-issues]
    paths: [.build-parts/READY]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.0-complete-issues
      - name: Assemble generated sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib test
          cat .build-parts/router.* | base64 --decode > lib/router.js
          cat .build-parts/toml.* | base64 --decode > lib/toml.js
          cat .build-parts/test.* | base64 --decode > test/router.test.js
          rm -rf .build-parts
          rm -f .github/workflows/assemble-release.yml
          npm run check
          npm test
          npm run test:package
      - name: Commit assembled release sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete model router 1.0.0 hardening"
          git push origin HEAD:release/1.0.0-complete-issues
