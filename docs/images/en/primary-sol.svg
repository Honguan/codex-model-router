<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Primary Model Scenario A – Primary is Sol"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#062b73"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#18365f" flood-opacity=".15"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#172b4d"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d41515"/></marker><style>text{font-family:Arial,sans-serif}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="800" y="62" font-size="39" font-weight="800" fill="#071633" text-anchor="middle">Primary Model Scenario A – Primary is Sol (#1 = Sol)</text><text x="800" y="108" font-size="22" font-weight="700" fill="#304b7a" text-anchor="middle">The #1 primary directly performs the Sol escalation-review role; no duplicate Sol child agent is called.</text><rect x="250" y="135" width="1050" height="72" rx="18" fill="#fff7f7" stroke="#d41515" stroke-width="2" filter="url(#s)"/><text x="775" y="180" font-size="22" font-weight="800" fill="#b11212" text-anchor="middle">Because #1 is already Sol, this scenario does not additionally call the #4 Sol agent.</text><g font-size="19" font-weight="800" text-anchor="middle"><rect x="55" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#6a1bb1" stroke-width="2"/><text x="152" y="270" fill="#6a1bb1">#1 Primary</text><rect x="270" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b5bd3" stroke-width="2"/><text x="367" y="270" fill="#0b5bd3">#2 Luna</text><rect x="485" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#0b7a2a" stroke-width="2"/><text x="582" y="270" fill="#0b7a2a">#3 Terra</text><rect x="700" y="230" width="195" height="62" rx="14" fill="#fff" stroke="#d41515" stroke-width="2"/><text x="797" y="270" fill="#d41515">#4 Sol</text></g><g font-size="17" font-weight="600" fill="#111827" text-anchor="middle"><rect x="35" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#6a1bb1" stroke-width="3" filter="url(#s)"/><text x="140" y="385" font-size="21" font-weight="800" fill="#6a1bb1">1. #1 (Sol) Primary</text><text x="140" y="450"><tspan x="140">Understand the request</tspan><tspan x="140" dy="25">and start the workflow</tspan></text><rect x="280" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#s)"/><text x="385" y="385" font-size="21" font-weight="800" fill="#0b5bd3">2. #2 Luna Agent</text><text x="385" y="450"><tspan x="385">Read requirements, rules,</tspan><tspan x="385" dy="25">code, and dependencies</tspan></text><rect x="525" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="630" y="385" font-size="21" font-weight="800" fill="#0b7a2a">3. #3 Terra Agent</text><text x="630" y="460">Draft / update PLAN.md</text><rect x="770" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#s)"/><text x="875" y="385" font-size="21" font-weight="800" fill="#0b5bd3">4. #2 Luna Agent</text><text x="875" y="460">Read PLAN.md and implement</text><rect x="1015" y="330" width="210" height="250" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="1120" y="385" font-size="21" font-weight="800" fill="#0b7a2a">5. #3 Terra Agent</text><text x="1120" y="460">Verify the result</text></g><g stroke="#172b4d" stroke-width="5" marker-end="url(#a)"><line x1="245" y1="455" x2="268" y2="455"/><line x1="490" y1="455" x2="513" y2="455"/><line x1="735" y1="455" x2="758" y2="455"/><line x1="980" y1="455" x2="1003" y2="455"/></g><line x1="1225" y1="455" x2="1290" y2="455" stroke="#0b7a2a" stroke-width="5" marker-end="url(#a)"/><text x="1260" y="430" font-size="18" font-weight="800" fill="#0b7a2a" text-anchor="middle">PASS</text><rect x="1300" y="350" width="180" height="210" rx="18" fill="#f7fff8" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="1390" y="430" font-size="18" font-weight="800" fill="#0b7a2a" text-anchor="middle"><tspan x="1390">Summarize and</tspan><tspan x="1390" dy="28">reply to the user</tspan></text><line x1="1120" y1="580" x2="1120" y2="650" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><text x="1150" y="625" font-size="18" font-weight="800" fill="#d41515">FAIL</text><g font-size="17" font-weight="600" text-anchor="middle"><rect x="1015" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#d41515" stroke-width="3" filter="url(#s)"/><text x="1137" y="720" font-size="21" font-weight="800" fill="#d41515">6. #1 (Sol) Primary</text><text x="1137" y="780"><tspan x="1137">Re-analyze and</tspan><tspan x="1137" dy="24">rewrite / revise PLAN.md</tspan></text><rect x="720" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#0b5bd3" stroke-width="3" filter="url(#s)"/><text x="842" y="720" font-size="21" font-weight="800" fill="#0b5bd3">7. #2 Luna Agent</text><text x="842" y="780"><tspan x="842">Re-read the revised plan</tspan><tspan x="842" dy="24">and implement again</tspan></text><rect x="425" y="665" width="245" height="210" rx="18" fill="#fff" stroke="#0b7a2a" stroke-width="3" filter="url(#s)"/><text x="547" y="720" font-size="21" font-weight="800" fill="#0b7a2a">8. #3 Terra Agent</text><text x="547" y="790">Re-verify the result</text></g><line x1="1015" y1="770" x2="977" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><line x1="720" y1="770" x2="682" y2="770" stroke="#d41515" stroke-width="5" marker-end="url(#r)"/><rect x="1265" y="600" width="300" height="310" rx="20" fill="#f7fbff" stroke="#0b5bd3" stroke-width="2" filter="url(#s)"/><rect x="1265" y="600" width="300" height="55" rx="20" fill="url(#h)"/><text x="1415" y="637" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Key Points</text><text x="1290" y="690" font-size="15" font-weight="700" fill="#17366c"><tspan x="1290">1. No duplicate same-model agent</tspan><tspan x="1290" dy="42">2. Sol reviews only on FAIL / rewrite</tspan><tspan x="1290" dy="42">3. Luna handles reading and implementation</tspan><tspan x="1290" dy="42">4. Terra handles planning and verification</tspan><tspan x="1290" dy="42">5. The #1 primary returns the final reply</tspan></text><rect x="55" y="910" width="1170" height="65" rx="16" fill="#fff9ec" stroke="#e99b00" stroke-width="2"/><text x="640" y="952" font-size="21" font-weight="800" fill="#7a4b00" text-anchor="middle">Success: #1→#2→#3→#2→#3→Reply　Repair: then #1→#2→#3</text></svg>