name: Apply v1.2.0 patch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/issues-18-26-v1.2.0
    paths:
      - ".codex-router-patch/**"
      - ".github/workflows/apply-v1.2.0-patch.yml"

permissions:
  contents: write

concurrency:
  group: apply-v1.2.0-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Honguan/codex-model-router' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issues-18-26-v1.2.0
          fetch-depth: 0

      - name: Decode and validate patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .codex-router-patch -maxdepth 1 -name 'chunk-*.txt' | wc -l)" -eq 7
          wc -c .codex-router-patch/chunk-*.txt
          sha1sum .codex-router-patch/chunk-*.txt
          cat .codex-router-patch/chunk-*.txt | base64 --decode > patch.tar.gz
          sha256sum patch.tar.gz
          tar --extract --gzip --file patch.tar.gz
          npm run check
          npm test
          npm run test:package

      - name: Commit completed implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex-router-patch patch.tar.gz .github/workflows/apply-v1.2.0-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: complete safety and release hardening for v1.2.0"
          git push origin HEAD:fix/issues-18-26-v1.2.0
