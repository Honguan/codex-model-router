.5" dy="0">xhigh</tspan></text><rect x="875" y="438" width="200" height="64" rx="14" fill="#f5f9ff" stroke="#0b5bd3" stroke-opacity="0.5"/><text x="975.0" y="478" font-size="20" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="975.0" dy="0">workspace-write</tspan></text><circle cx="1140" cy="470" r="32" fill="#fff" stroke="#0b5bd3" stroke-width="3"/><text x="1140" y="479" font-size="30" font-weight="800" fill="#0b5bd3" text-anchor="middle"><tspan x="1140" dy="0">◎</tspan></text><text x="1190" y="457" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1190" dy="0">Requirement evidence</tspan><tspan x="1190" dy="25.6">and implementation</tspan></text><rect x="40" y="545" width="1520" height="150" fill="#f5fff7" stroke="#d6dfed"/><circle cx="85" cy="620" r="34" fill="#0b7a2a"/><text x="85" y="629" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">#3</text><circle cx="145" cy="607.7" r="11.0" fill="#0b7a2a"/><path d="M125.2,644.0 Q145,619.8 164.8,644.0 Z" fill="#0b7a2a"/><text x="185" y="612" font-size="23" font-weight="800" fill="#0b7a2a" text-anchor="start"><tspan x="185" dy="0">Terra</tspan></text><rect x="315" y="588" width="245" height="64" rx="14" fill="#f5fff7" stroke="#0b7a2a" stroke-opacity="0.5"/><text x="437.5" y="628" font-size="20" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="437.5" dy="0">gpt-5.6-terra</tspan></text><rect x="585" y="588" width="245" height="64" rx="14" fill="#f5fff7" stroke="#0b7a2a" stroke-opacity="0.5"/><text x="707.5" y="628" font-size="20" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="707.5" dy="0">high</tspan></text><rect x="875" y="588" width="200" height="64" rx="14" fill="#f5fff7" stroke="#0b7a2a" stroke-opacity="0.5"/><text x="975.0" y="628" font-size="20" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="975.0" dy="0">read-only</tspan></text><circle cx="1140" cy="620" r="32" fill="#fff" stroke="#0b7a2a" stroke-width="3"/><text x="1140" y="629" font-size="30" font-weight="800" fill="#0b7a2a" text-anchor="middle"><tspan x="1140" dy="0">◎</tspan></text><text x="1190" y="607" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1190" dy="0">Planning and</tspan><tspan x="1190" dy="25.6">independent verification</tspan></text><rect x="40" y="695" width="1520" height="150" fill="#fff7f7" stroke="#d6dfed"/><circle cx="85" cy="770" r="34" fill="#d41515"/><text x="85" y="779" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">#4</text><circle cx="145" cy="757.7" r="11.0" fill="#d41515"/><path d="M125.2,794.0 Q145,769.8 164.8,794.0 Z" fill="#d41515"/><text x="185" y="762" font-size="23" font-weight="800" fill="#d41515" text-anchor="start"><tspan x="185" dy="0">Sol</tspan></text><rect x="315" y="738" width="245" height="64" rx="14" fill="#fff7f7" stroke="#d41515" stroke-opacity="0.5"/><text x="437.5" y="778" font-size="20" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="437.5" dy="0">gpt-5.6-sol</tspan></text><rect x="585" y="738" width="245" height="64" rx="14" fill="#fff7f7" stroke="#d41515" stroke-opacity="0.5"/><text x="707.5" y="778" font-size="20" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="707.5" dy="0">medium</tspan></text><rect x="875" y="738" width="200" height="64" rx="14" fill="#fff7f7" stroke="#d41515" stroke-opacity="0.5"/><text x="975.0" y="778" font-size="20" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="975.0" dy="0">read-only</tspan></text><circle cx="1140" cy="770" r="32" fill="#fff" stroke="#d41515" stroke-width="3"/><text x="1140" y="779" font-size="30" font-weight="800" fill="#d41515" text-anchor="middle"><tspan x="1140" dy="0">◎</tspan></text><text x="1190" y="757" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1190" dy="0">Failed-verification analysis</tspan><tspan x="1190" dy="25.6">and plan revision</tspan></text><rect x="40" y="870" width="720" height="165" rx="20" fill="#fffaf0" stroke="#e99b00" stroke-width="2" filter="url(#shadow)"/><text x="90" y="915" font-size="28" font-weight="800" fill="#e99b00" text-anchor="start"><tspan x="90" dy="0">Key Notes</tspan></text><text x="95" y="952" font-size="18" font-weight="700" fill="#222" text-anchor="start"><tspan x="95" dy="0">✓  Luna is the only writable role.</tspan></text><text x="95" y="980" font-size="18" font-weight="700" fill="#222" text-anchor="start"><tspan x="95" dy="0">✓  Luna does not own architecture decisions or self-approve.</tspan></text><text x="95" y="1008" font-size="18" font-weight="700" fill="#222" text-anchor="start"><tspan x="95" dy="0">✓  Terra and Sol do not edit implementation files.</tspan></text><text x="95" y="1036" font-size="18" font-weight="700" fill="#222" text-anchor="start"><tspan x="95" dy="0">✓  The same-model agent is not called repeatedly.</tspan></text><rect x="790" y="870" width="770" height="165" rx="20" fill="#f5f9ff" stroke="#0b5bd3" stroke-width="2" filter="url(#shadow)"/><text x="840" y="915" font-size="28" font-weight="800" fill="#0b5bd3" text-anchor="start"><tspan x="840" dy="0">Relationship Summary</tspan></text><text x="845" y="952" font-size="18" font-weight="700" fill="#6a1bb1" text-anchor="start"><tspan x="845" dy="0">Primary: conversation and final reply</tspan></text><text x="845" y="980" font-size="18" font-weight="700" fill="#0b5bd3" text-anchor="start"><tspan x="845" dy="0">Luna: reading and implementation</tspan></text><text x="845" y="1008" font-size="18" font-weight="700" fill="#0b7a2a" text-anchor="start"><tspan x="845" dy="0">Terra: planning and verification</tspan></text><text x="845" y="1036" font-size="18" font-weight="700" fill="#d41515" text-anchor="start"><tspan x="845" dy="0">Sol: failure repair only</tspan></text></svg>