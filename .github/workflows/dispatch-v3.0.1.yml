name: Dispatch v3.0.1 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-v3.0.1.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the validated release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=v3.0.1 -f action=prepare-and-release
