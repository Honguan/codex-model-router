name: Inspect v3.0.1 Release

on:
  pull_request:
    branches:
      - main
    paths:
      - release-trigger-v3.0.1.txt

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'release/trigger-v3.0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Show recent release workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run list --repo Honguan/codex-model-router --workflow release.yml --event workflow_dispatch --limit 5 --json databaseId,status,conclusion,createdAt,url,headSha,displayTitle
