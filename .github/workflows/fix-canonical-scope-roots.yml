name: Fix canonical scope roots

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'Honguan/codex-model-router' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issues-18-26-v1.2.0
          fetch-depth: 0

      - name: Canonicalize user-selected root anchors
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("lib/router-core.js")
          text = path.read_text(encoding="utf-8")

          marker = "async function assertNoIndirection(target, root, anchor, label) {"
          helper = """async function canonicalizeRoot(path) {
            const absolute = resolve(path);
            const ancestor = await nearestExistingAncestor(absolute);
            const physicalAncestor = await realpath(ancestor);
            return resolve(physicalAncestor, relative(ancestor, absolute));
          }

          async function canonicalizeScope(scope) {
            return {
              ...scope,
              cwd: await canonicalizeRoot(scope.cwd),
              home: await canonicalizeRoot(scope.home ?? homedir())
            };
          }

          """
          if "async function canonicalizeScope(scope)" not in text:
              if marker not in text:
                  raise SystemExit("assertNoIndirection marker not found")
              text = text.replace(marker, helper + marker, 1)

          pattern = re.compile(
              r"\n\s*const scope = \{\n"
              r"\s*cwd: options\.cwd \?\? process\.cwd\(\),\n"
              r"\s*home: options\.home,\n"
              r"\s*env: options\.env \?\? process\.env,\n"
              r"\s*global: parsed\.flags\.global\n"
              r"\s*\};\n"
              r"\s*const location = expectedPaths\(scope\);\n\n"
              r"\s*try \{\n"
              r"\s*await validateLocationSafety\(location\);"
          )
          replacement = """

          try {
            const scope = await canonicalizeScope({
              cwd: options.cwd ?? process.cwd(),
              home: options.home,
              env: options.env ?? process.env,
              global: parsed.flags.global
            });
            const location = expectedPaths(scope);
            await validateLocationSafety(location);"""
          if "const scope = await canonicalizeScope" not in text:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("run scope block not found")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          npm run check
          npm test
          npm run test:package

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- lib/router-core.js; then
            echo "Fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/router-core.js
          git commit -m "fix: canonicalize scope roots across platform aliases"
          git push origin HEAD:fix/issues-18-26-v1.2.0
