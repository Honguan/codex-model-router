name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm run check
      - run: npm test
      - run: npm run test:package

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          expected_tag="v${PACKAGE_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Check npm version
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          published="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null || true)"
          if [ "${published}" = "${PACKAGE_VERSION}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package to npm
        if: steps.npm.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Repository secret NPM_TOKEN is not configured"
            exit 1
          fi
          npm publish --access public

      - name: Verify npm package
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null || true)"
            if [ "${published}" = "${PACKAGE_VERSION}" ]; then
              echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION} on npm"
              exit 0
            fi
            echo "Waiting for npm registry propagation (${attempt}/6)"
            sleep 10
          done
          echo "::error::Unable to verify ${PACKAGE_NAME}@${PACKAGE_VERSION} on npm"
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists"
          else
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              --notes-file CHANGELOG.md
          fi
