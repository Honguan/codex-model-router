name: Fix Windows path alias handling

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/issues-18-26-v1.2.0
    paths:
      - ".github/workflows/fix-windows-path-alias.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'Honguan/codex-model-router' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issues-18-26-v1.2.0
          fetch-depth: 0

      - name: Apply physical-anchor path comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/router-core.js")
          text = path.read_text(encoding="utf-8")
          if "const physicalAnchor = await realpath(absoluteAnchor);" not in text:
              first = "  const components = rel ? rel.split(sep) : [];\n  let current = absoluteAnchor;"
              first_replacement = "  const components = rel ? rel.split(sep) : [];\n  const physicalAnchor = await realpath(absoluteAnchor);\n  let current = absoluteAnchor;"
              second = "    const physical = await realpath(candidate);\n    if (normalizeForCompare(physical) !== normalizeForCompare(candidate)) {"
              second_replacement = "    const physical = await realpath(candidate);\n    const expectedPhysical = resolve(physicalAnchor, relative(absoluteAnchor, candidate));\n    if (normalizeForCompare(physical) !== normalizeForCompare(expectedPhysical)) {"
              if text.count(first) != 1 or text.count(second) != 1:
                  raise SystemExit("expected path validation fragments were not found exactly once")
              text = text.replace(first, first_replacement).replace(second, second_replacement)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          npm run check
          npm test
          npm run test:package

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- lib/router-core.js; then
            echo "Fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/router-core.js
          git commit -m "fix: accept equivalent Windows physical path aliases"
          git push origin HEAD:fix/issues-18-26-v1.2.0
