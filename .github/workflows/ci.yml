name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run test:package

  workflow-lint:
    name: Workflow and compatibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install pinned actionlint and ShellCheck
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          actionlint -version
          shellcheck --version
      - name: Lint workflows and shell
        run: scripts/lint-workflows.sh
      - name: Verify Codex compatibility baseline
        run: npx --yes @openai/codex@0.145.0 --version
